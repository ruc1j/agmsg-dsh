# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# dsh: DeepSeek Harness (dsh / dsh-tui). External type plugin.
#
# dsh has no Monitor-style tool that streams a command's stdout line by line.
# What it does have is background bash jobs whose completion wakes an idle
# agent with an in-session notice (dsh-tool-jobs). Delivery therefore runs a
# one-shot watcher (dsh-watch.sh) as a background job: it exits as soon as
# unread messages exist, printing and consuming them, and the agent re-arms it.
# Claude Code-format SessionStart/Stop hooks, run by dsh's own
# @deepseek-ai/dsh-hooks-claude-code bridge from one global config
# (~/.dsh/agmsg-hooks.json), start the watcher and force a re-arm when it is
# missing. Per-project opt-in is the marker file named by hooks_file.
name=dsh
template=template.md
detect=DSH_SESSION_ID
session_env=DSH_SESSION_ID
hooks_file=.dsh/agmsg-delivery
readiness_sentinel=no
delivery_modes=monitor off
